license.workspace = true

[dependencies]
linet-core.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["process"] }
quinn.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
ring.workspace = true
tracing.workspace = true
